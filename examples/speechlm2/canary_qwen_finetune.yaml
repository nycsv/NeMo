# =============================================================================
#  canary_qwen_finetune.yaml
#
#  Complete fine-tuning config for nvidia/canary-qwen-2.5b
#  Strategy  : DDPStrategy
#  Accelerator: gpu
#
#  Reference:
#    https://huggingface.co/nvidia/canary-qwen-2.5b/discussions/13
#
#  Usage:
#    torchrun --standalone --nnodes=1 --nproc_per_node=4 \
#        finetune_canary_qwen.py \
#        --config-path=. \
#        --config-name=canary_qwen_finetune
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
#  MODEL
# ─────────────────────────────────────────────────────────────────────────────
model:

  # ── Backbone sources ──────────────────────────────────────────────────────
  #
  # pretrained_llm : HuggingFace AutoModelForCausalLM ID or local path.
  # pretrained_asr : NeMo ASR model — three accepted forms:
  #     (a) HuggingFace Hub ID  → nvidia/canary-1b-flash  (auto-downloaded)
  #                               nvidia/canary-1b-v2      (auto-downloaded)
  #     (b) NGC model name      → stt_en_fastconformer_hybrid_large_streaming_80ms
  #     (c) Local .nemo path    → /ckpts/canary-1b-v2.nemo
  #
  # When pretrained_weights: True  → weights loaded from BOTH sources below.
  # When pretrained_weights: False → architecture only; weights come from
  #                                   canary_qwen_pretrained_path / module_weights.
  pretrained_llm: Qwen/Qwen3-1.7B
  pretrained_asr: nvidia/canary-1b-flash

  # ── Weight loading mode ───────────────────────────────────────────────────
  #
  # False (default) — fine-tune the released canary-qwen-2.5b checkpoint.
  #   Architecture is built from the YAML perception block below.
  #   Weights come from canary_qwen_pretrained_path (and module_weights overrides).
  #
  # True  — assemble SALM from scratch using pretrained components.
  #   Loads pretrained_llm from HuggingFace and pretrained_asr from NeMo/HF Hub.
  #   No canary_qwen_pretrained_path needed.
  #   Example: swap in canary-1b-v2 as the encoder:
  #     pretrained_weights: True
  #     pretrained_asr: nvidia/canary-1b-v2
  #     canary_qwen_pretrained_path: null
  pretrained_weights: False

  # Path to the full canary-qwen-2.5b.nemo (created by convert.py).
  # Used as the baseline when module_weights below are not set.
  canary_qwen_pretrained_path: /path/to/canary-qwen-2.5b.nemo

  # ── Per-module checkpoint overrides ────────────────────────────────────────
  # Each entry is optional (null = fall back to canary_qwen_pretrained_path).
  # When set, the module .nemo takes priority over the full checkpoint for that
  # specific sub-module, allowing independent module versioning.
  #
  # Produced by: python convert_modules.py canary-qwen-2.5b.nemo
  #
  # Load priority per module:
  #   module_weights.X  >  canary_qwen_pretrained_path  >  random init
  #
  module_weights:
    # LLM backbone (Qwen transformer layers + lm_head).
    llm: null          # e.g. /ckpts/canary-qwen-2.5b_llm.nemo

    # Token embedding (embed_tokens, moved outside llm for FSDP/TP safety).
    embed_tokens: null # e.g. /ckpts/canary-qwen-2.5b_embed_tokens.nemo

    # Full audio perception module (encoder + preprocessor + modality adapter + proj).
    # Produced by: python convert_modules.py canary-qwen-2.5b.nemo
    perception: null   # e.g. /ckpts/canary-qwen-2.5b_perception.nemo

    # FastConformer encoder + preprocessor from any NeMo ASR checkpoint.
    # Loads encoder.* and preprocessor.* keys into model.perception (strict=False).
    # Ignored when module_weights.perception is already set.
    #
    # Accepted values (same three forms as pretrained_asr above):
    #   nvidia/canary-1b-v2      ← HF Hub ID, auto-downloaded
    #   nvidia/canary-1b-flash   ← HF Hub ID, auto-downloaded
    #   /ckpts/canary-1b-v2.nemo ← local path
    #   (extract first: python convert_modules.py --from-asr canary-1b-v2.nemo)
    #
    # Typical use: fine-tune canary-qwen-2.5b but replace the encoder with v2.
    #   pretrained_weights: False
    #   canary_qwen_pretrained_path: canary-qwen-2.5b.nemo   ← loads everything
    #   module_weights:
    #     perception_from_asr: nvidia/canary-1b-v2            ← then swap encoder
    perception_from_asr: null

  # ── Frozen parameters ─────────────────────────────────────────────────────
  # Regex patterns matched against parameter names (re.compile).
  # LLM backbone + embedding are frozen; LoRA + perception adapter are trained.
  freeze_params:
    - "^llm\\..+$"
    - "^embed_tokens\\..+$"
  # Uncomment to also freeze ASR encoder (adapter-only training):
  # freeze_params:
  #   - "^llm\\..+$"
  #   - "^embed_tokens\\..+$"
  #   - "^perception\\.preprocessor\\..+$"
  #   - "^perception\\.encoder\\..+$"
  prevent_freeze_params: []

  # ── LoRA ──────────────────────────────────────────────────────────────────
  lora:
    task_type: CAUSAL_LM
    r: 128
    lora_alpha: 256
    lora_dropout: 0.01
    target_modules: ["q_proj", "v_proj"]

  # ── Prompt / audio ────────────────────────────────────────────────────────
  prompt_format: qwen
  audio_locator_tag: "<|audioplaceholder|>"

  # ── Perception module ─────────────────────────────────────────────────────
  perception:
    target: nemo.collections.speechlm2.modules.perception.AudioPerceptionModule
    output_dim: 2048

    # Preprocessor — canary-1b-flash: 128 mel bins, 16 kHz
    preprocessor:
      _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
      sample_rate: 16000
      normalize: per_feature
      window_size: 0.025
      window_stride: 0.01
      window: hann
      features: 128             # ← must match encoder.feat_in
      n_fft: 512
      frame_splicing: 1
      dither: 1.0e-05
      pad_to: 0
      pad_value: 0.0

    # Encoder — FastConformer Large (canary-1b-flash: 32 layers, d_model=1024)
    encoder:
      _target_: nemo.collections.asr.modules.ConformerEncoder
      feat_in: 128              # ← must match preprocessor.features
      feat_out: -1              # -1 keeps d_model as output dim
      n_layers: 32
      d_model: 1024
      subsampling: dw_striding  # depthwise striding (FastConformer)
      subsampling_factor: 8     # → 80 ms frame rate = token_equivalent_duration 0.08
      subsampling_conv_channels: 256
      causal_downsampling: false
      ff_expansion_factor: 4
      self_attention_model: rel_pos
      n_heads: 8
      att_context_size: [-1, -1]  # unlimited (non-streaming)
      att_context_probs: []
      att_context_style: regular
      xscaling: true
      untie_biases: true
      pos_emb_max_len: 5000
      conv_kernel_size: 9
      conv_norm_type: batch_norm
      conv_context_size: null
      dropout: 0.0
      dropout_pre_encoder: 0.0
      dropout_emb: 0.0
      dropout_att: 0.0

    # Modality adapter — pass-through (encoder output 1024 → LLM input 2048
    # is handled by output_dim projection inside AudioPerceptionModule)
    modality_adapter:
      _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
      d_model: 1024

    # Spectrogram augmentation (optional, uncomment to enable)
    # spec_augment:
    #   _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    #   freq_masks: 2
    #   time_masks: 10
    #   freq_width: 27
    #   time_width: 5

  # ── Optimizer ─────────────────────────────────────────────────────────────
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1.0e-4
    betas: [0.9, 0.98]
    weight_decay: 1.0e-3
    foreach: true

  # ── LR scheduler ──────────────────────────────────────────────────────────
  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 500
    min_lr: 1.0e-6
    max_steps: ${trainer.max_steps}


# ─────────────────────────────────────────────────────────────────────────────
#  TRAINER
# ─────────────────────────────────────────────────────────────────────────────
trainer:
  # ── Accelerator & devices ─────────────────────────────────────────────────
  accelerator: gpu          # use CUDA GPUs
  devices: -1               # -1 = use all available GPUs on the node
  num_nodes: 1              # single node

  # ── DDP strategy ──────────────────────────────────────────────────────────
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    find_unused_parameters: true   # required when some params are frozen (LoRA)

  # ── Precision ─────────────────────────────────────────────────────────────
  precision: bf16-true      # bfloat16 (no AMP scaler, more stable than fp16)

  # ── Training loop ─────────────────────────────────────────────────────────
  max_steps: 10000
  limit_train_batches: 1000   # steps per validation cycle
  val_check_interval: 1000    # validate every 1000 steps
  limit_val_batches: 20
  log_every_n_steps: 10
  num_sanity_val_steps: 0     # skip sanity check (saves time at startup)
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1

  # ── Misc ──────────────────────────────────────────────────────────────────
  logger: false               # logging handled by exp_manager
  enable_checkpointing: false # checkpointing handled by exp_manager
  use_distributed_sampler: false


# ─────────────────────────────────────────────────────────────────────────────
#  DATA
# ─────────────────────────────────────────────────────────────────────────────
data:

  # ── Training ──────────────────────────────────────────────────────────────
  train_ds:
    sample_rate: 16000
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08   # must match encoder subsampling_factor=8

    input_cfg:
      - type: lhotse_as_conversation
        input_cfg: /path/to/input_cfg.yaml   # ← your input_cfg.yaml
        audio_locator_tag: ${model.audio_locator_tag}
        tags:
          context: "Transcribe the following:"

    seed: 42
    shuffle: true
    shard_seed: "randomized"
    num_workers: 4

    # Bucketed dynamic batching — tuned for A100 80 GB per GPU.
    # For smaller GPUs (40 GB), halve bucket_batch_size values.
    use_multimodal_sampling: true
    use_bucketing: true
    num_buckets: 16
    bucket_buffer_size: 20000
    min_duration: 0.1
    min_tokens: 2
    max_tokens: 1024
    bucket_duration_bins:
      [99, 110, 117, 124, 184, 247, 324, 391, 457, 520, 555, 579, 600, 618, 638, 1024]
    bucket_batch_size:
      [69,  64,  60,  40,  28,  22,  16,  14,  12,  11,  10,   6,   4,   4,   4,    2]

  # ── Validation ────────────────────────────────────────────────────────────
  validation_ds:
    sample_rate: 16000
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: 0.08
    batch_size: 8
    seed: 42
    shard_seed: "randomized"

    datasets:
      my_devset:
        input_cfg:
          - type: lhotse_as_conversation
            cuts_path: /path/to/val_cuts_*.jsonl.gz   # ← your val CutSet (glob ok)
            audio_locator_tag: ${model.audio_locator_tag}
            tags:
              context: "Transcribe the following:"


# ─────────────────────────────────────────────────────────────────────────────
#  EXP MANAGER
# ─────────────────────────────────────────────────────────────────────────────
exp_manager:
  exp_dir: null
  explicit_log_dir: ./canary-qwen-finetune-results
  name: canary-qwen-2.5b-finetune
  use_datetime_version: true

  # ── Logging ───────────────────────────────────────────────────────────────
  create_tensorboard_logger: true
  create_wandb_logger: false
  wandb_logger_kwargs:
    name: canary-qwen-2.5b-finetune
    project: canary-qwen
    resume: true

  # ── Checkpointing ─────────────────────────────────────────────────────────
  create_checkpoint_callback: true
  checkpoint_callback_params:
    filename: "step={step}"
    monitor: val_wer
    mode: min
    save_top_k: 3
    every_n_train_steps: null
    every_n_epochs: 1
    always_save_nemo: false

  # ── Resume ────────────────────────────────────────────────────────────────
  resume_from_checkpoint: null
  resume_if_exists: true
  resume_ignore_no_checkpoint: true
